<header class="topbar">
  <button class="menu-button" type="button" aria-label="Open navigation menu" (click)="menuToggle.emit()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
  </button>
  <div class="topbar__page">
    <p class="topbar__eyebrow">UrbanNest Interiors <span>/</span> Workspace</p>
    <h1>{{ page() }}</h1>
  </div>
  <div class="topbar__actions">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" /><path d="m16 16 4.2 4.2" /></svg>
      <input
        type="search"
        aria-label="Search leads and enquiries"
        placeholder="Search anything..."
        [value]="searchTerm()"
        (input)="updateSearch($event)"
      />
      @if (searchTerm()) {
        <button type="button" aria-label="Clear search" (click)="clearSearch()">×</button>
      } @else {
        <kbd>⌘ K</kbd>
      }
    </div>
    <button class="notification-button" type="button" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg>
      <span></span>
    </button>
    <span class="topbar__avatar" aria-label="Ananya Sharma">AS</span>
  </div>
</header>
