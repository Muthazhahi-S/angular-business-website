<footer class="footer">
  <div class="container">
    <div class="footer__main">
      <div class="footer__brand">
        <app-brand />
        <p>{{ business.tagline }}</p>
      </div>
      <nav class="footer__links" aria-label="Footer navigation">
        <div><strong>Explore</strong><a href="#services">Services</a><a href="#about">About</a><a href="#process">Our process</a></div>
        <div><strong>Contact</strong><a [href]="'mailto:' + business.email">{{ business.email }}</a><a [href]="'tel:' + business.phoneLink">{{ business.phone }}</a><span>{{ business.address }}</span></div>
      </nav>
      <a class="footer__top" href="#home">Back to top <span aria-hidden="true">↑</span></a>
    </div>
    <div class="footer__bottom">
      <p>© {{ year }} {{ business.name }}.</p>
      <a href="#contact">Contact {{ business.name }}</a>
      @if (business.demoMode && business.showDemoReminders) {
        <p>{{ business.footerDemoReminder }}</p>
      }
    </div>
  </div>
</footer>
