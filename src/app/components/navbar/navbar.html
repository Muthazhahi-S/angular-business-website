<header class="site-header">
  <nav class="container nav" aria-label="Main navigation">
    <a class="brand" href="#home" aria-label="Northstar Studio home" (click)="closeMenu()">
      <span class="brand__mark" aria-hidden="true">N</span>
      <span class="brand__name">northstar<span>studio</span></span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-links"
      [attr.aria-label]="menuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
    </button>

    <div class="nav__links" id="primary-links" [class.nav__links--open]="menuOpen()">
      <a href="#services" (click)="closeMenu()">What we do</a>
      <a href="#about" (click)="closeMenu()">About us</a>
      <a href="#testimonials" (click)="closeMenu()">Our clients</a>
      <a class="nav__contact" href="#contact" (click)="closeMenu()">
        Let's talk <span aria-hidden="true">↗</span>
      </a>
    </div>
  </nav>
</header>
