<article class="stat-card" [class]="'stat-card stat-card--' + tone()">
  <div class="stat-card__top">
    <span class="stat-card__label">{{ label() }}</span>
    <span class="stat-card__icon" aria-hidden="true">
      @switch (icon()) {
        @case ('leads') {
          <svg viewBox="0 0 24 24" fill="none"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M20 8v6M23 11h-6" /></svg>
        }
        @case ('enquiries') {
          <svg viewBox="0 0 24 24" fill="none"><path d="M21 15a4 4 0 0 1-4 4H7l-4 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4zM8 10h8M8 14h5" /></svg>
        }
        @case ('contacted') {
          <svg viewBox="0 0 24 24" fill="none"><path d="M21 16.5v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 1.1 3.7 2 2 0 0 1 3.1 1.5h3a2 2 0 0 1 2 1.7l.5 3a2 2 0 0 1-.6 1.7L6.8 9a16 16 0 0 0 6 6l1.1-1.2a2 2 0 0 1 1.7-.6l3 .5a2 2 0 0 1 1.7 2.8Z" /></svg>
        }
        @default {
          <svg viewBox="0 0 24 24" fill="none"><path d="m5 12 4 4L19 6" /></svg>
        }
      }
    </span>
  </div>
  <p class="stat-card__value">{{ value() }}</p>
  <div class="stat-card__bottom">
    <span class="stat-card__live-dot" aria-hidden="true"></span>
    <span>Live workspace data</span>
  </div>
</article>
