<section class="why section" aria-labelledby="why-title">
  <div class="container why__grid">
    <div class="why__intro">
      <p class="eyebrow">{{ business.why.eyebrow }}</p>
      <h2 class="section-heading" id="why-title">{{ business.why.headingLead }}<br><em>{{ business.why.headingEmphasis }}</em></h2>
      <p class="section-intro">{{ business.why.intro }}</p>
      <a class="button button--light" href="#contact">{{ business.why.cta }} <span aria-hidden="true">↗</span></a>
    </div>
    <div class="why__list">
      @for (principle of principles; track principle.number) {
        <article class="why__item">
          <span>{{ principle.number }}</span>
          <div><h3>{{ principle.title }}</h3><p>{{ principle.description }}</p></div>
        </article>
      }
    </div>
  </div>
</section>
